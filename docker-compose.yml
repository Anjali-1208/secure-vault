version: "3.8"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/secure-vault
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=2h
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - PORT=5000
      - MAX_LOGIN_ATTEMPTS=5
      - LOCK_TIME_MINUTES=15
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data: